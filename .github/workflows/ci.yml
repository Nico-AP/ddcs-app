name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install linting tools
        run: pip install ruff==0.15.10 djlint==1.36.4

      - name: Ruff — check
        run: ruff check .

      - name: Ruff — format
        run: ruff format --check .

      - name: djLint — check templates
        run: djlint ddcs/ --check

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      SECRET_KEY: ci-only-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install gettext (required for compilemessages)
        run: sudo apt-get install -y gettext

      - name: Install Python dependencies
        run: pip install -r requirements/dev.txt

      - name: Compile translations
        run: python manage.py compilemessages

      - name: Django system check
        run: python manage.py check --fail-level WARNING

      - name: Run migrations
        run: python manage.py migrate --no-input

      - name: Run tests with coverage
        run: python -m coverage run manage.py test

      - name: Coverage report
        run: python -m coverage report
