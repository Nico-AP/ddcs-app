name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install pre-commit
        run: pip install pre-commit==4.5.1

      - name: Run pre-commit hooks
        run: SKIP=check-translations pre-commit run --all-files

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      SECRET_KEY: ci-only-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install gettext (required for compilemessages)
        run: sudo apt-get install -y gettext

      - name: Install Python dependencies
        run: pip install -r requirements/dev.txt

      - name: Compile translations
        run: python manage.py compilemessages

      - name: Django system check
        run: python manage.py check --fail-level WARNING

      - name: Run migrations
        run: python manage.py migrate --no-input

      - name: Run tests with coverage
        run: python -m coverage run manage.py test

      - name: Coverage report
        run: python -m coverage report
