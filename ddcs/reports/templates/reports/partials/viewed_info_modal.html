<div class="modal fade"
     id="viewedInfo"
     tabindex="-1"
     aria-labelledby="viewedInfoLabel"
     aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="viewedInfoLabel">
          Was heißt „angesehen“?
        </h2>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Schließen"></button>
      </div>
      <div class="modal-body text-start">
        <p class="mb-0">
          Wenn nicht anders angegeben, meinen wir mit „angesehen“, dass ein
          Video in deinem Feed aufgetaucht ist — unabhängig davon, wie kurz
          oder lange du dabei verweilt oder wie schnell du weitergescrollt
          hast.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Schließen
        </button>
      </div>
    </div>
  </div>
</div>
