<div class="modal fade"
     id="sessionInfo"
     tabindex="-1"
     aria-labelledby="sessionInfoLabel"
     aria-hidden="true">
  <div class="modal-dialog ddcs-modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="sessionInfoLabel">
          Was ist eine Session?
        </h2>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Schließen"></button>
      </div>
      <div class="modal-body text-start">
        <p class="mb-0">
          Eine Session ist eine zusammenhängende Nutzungsphase auf TikTok.
          Solange zwischen zwei Videos höchstens 90&nbsp;Sekunden liegen,
          zählen sie zur gleichen Session. Dauert die Pause länger,
          beginnt eine neue Session.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Schließen
        </button>
      </div>
    </div>
  </div>
</div>
