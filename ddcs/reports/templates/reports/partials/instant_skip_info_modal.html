<div class="modal fade"
     id="instantSkipInfo"
     tabindex="-1"
     aria-labelledby="instantSkipInfoLabel"
     aria-hidden="true">
  <div class="modal-dialog ddcs-modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="instantSkipInfoLabel">
          Was heißt „direkt weiterscrollen“?
        </h2>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Schließen"></button>
      </div>
      <div class="modal-body text-start">
        <p class="mb-0">
          Wir zählen ein Video als „direkt weitergescrollt“, wenn zwischen
          diesem und dem nächsten Video in deiner Wiedergabeliste weniger
          als 1&nbsp;Sekunde liegt. Der Anteil zeigt, wie oft das bei dir
          vorkommt.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Schließen
        </button>
      </div>
    </div>
  </div>
</div>
