{% load static %}

<div id="participation" class="container pt-5 pb-5 border-bottom align-items-center">
  <div class="row">

    <div class="col-12 py-5">

      <div class="fs-6 mb-3 text-hero-subtitle">
        {{ value.pre_title }}
      </div>

      <div>
        <h2>{{ value.title }}</h2>
      </div>

      <div class="row pt-2 pb-4">

        <div class="col-12 col-sm-4 my-2">
          <div class="card h-100 text-bg-light step-card">
            <div class="card-body">
              <p><span class="participation-step-indicator">1</span></p>
              <h3>{{ value.step_1_title }}</h3>
              <p>{{ value.step_1_content }}</p>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-4 my-2">
          <div class="card h-100 text-bg-light step-card">
            <div class="card-body d-flex flex-column justify-content-between">
              <p><span class="participation-step-indicator">2</span></p>
              <h3>{{ value.step_2_title }}</h3>
              <p>{{ value.step_2_content }}</p>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-4 my-2">
          <div class="card h-100 text-bg-light step-card">
            <div class="card-body">
              <p><span class="participation-step-indicator">3</span></p>
              <h3>{{ value.step_3_title }}</h3>
              <p>{{ value.step_3_content }}</p>
            </div>
          </div>
        </div>

      </div>

      <div>
        {{ value.content }}
      </div>

      <div class="d-flex flex-row">
        <div class="me-3">
          <a href="#" class="btn btn-dark btn-primary-dfdw">
            Jetzt teilnehmen
          </a>
        </div>
      </div>

    </div>

  </div>
</div>
