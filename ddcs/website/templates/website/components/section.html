<section id="{{ value.anchor_id }}" class="container pt-5 pb-5">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8 py-5">
      <div class="eyebrow">
        {{ value.pre_title }}
      </div>
      <div>
        <h2>{{ value.title }}</h2>
      </div>

      {% for block in value.body %}
        {{ block }}
      {% endfor %}

    </div>
  </div>
</section>
