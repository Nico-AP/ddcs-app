{% load wagtailcore_tags %}

<section id="{{ value.anchor_id }}" class="container pt-5 pb-5">
  <div class="row">
    <div class="col-12 py-5">
      <div class="fs-6 mb-3 text-hero-subtitle">
        {{ value.pre_title }}
      </div>
      <div>
        <h2>{{ value.title }}</h2>
      </div>
      <div class="row justify-content-start">
        {% for card in self.cards %}
          <div class="col-12 col-sm-6 col-md-4 my-3">
            {% include_block card %}
          </div>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
