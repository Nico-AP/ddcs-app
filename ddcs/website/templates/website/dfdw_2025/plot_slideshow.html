<div id="carouselPlots" class="carousel slide plot-slideshow">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#carouselPlots" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#carouselPlots" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#carouselPlots" data-bs-slide-to="2" aria-label="Slide 3"></button>
    <button type="button" data-bs-target="#carouselPlots" data-bs-slide-to="3" aria-label="Slide 4"></button>
  </div>
  <div class="carousel-inner">
    <div class="carousel-item active">
      {% include "website/dfdw_2025/plots/party_timeseries.html" %}
    </div>
    <div class="carousel-item">
      {% include "website/dfdw_2025/plots/party_squares_plot.html" %}
    </div>
    <div class="carousel-item">
      {% include "website/dfdw_2025/plots/party_view_barplot.html" %}
    </div>
    <div class="carousel-item">
      {% include "website/dfdw_2025/plots/party_likes_barplot.html" %}
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselPlots" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselPlots" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
